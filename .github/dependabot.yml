# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # TEMPLATE: UNCOMMENT when you add a package.json. Dependabot reports an error
  # ("/package.json not found") for an npm entry with no manifest, so it ships disabled.
  # pnpm uses package.json + pnpm-lock.yaml; Dependabot treats it as "npm".
  #
  # - package-ecosystem: "npm"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #   open-pull-requests-limit: 10
  #   labels: ["dependencies"]
  #   commit-message:
  #     prefix: "chore"
  #   groups:
  #     minor-and-patch:
  #       patterns: ["*"]
  #       update-types: ["minor", "patch"]

  # Keeps SHA-pinned actions current (the version comment is updated too)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
