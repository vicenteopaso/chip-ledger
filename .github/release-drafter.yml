name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "Features"
    labels: ["enhancement", "feature"]
  - title: "Fixes"
    labels: ["bug", "fix"]
  - title: "Security"
    labels: ["security"]
  - title: "Documentation"
    labels: ["documentation", "docs"]
  - title: "Maintenance"
    labels: ["chore", "refactor", "dependencies", "github-actions"]

change-template: "- $TITLE (#$NUMBER) by @$AUTHOR"
exclude-labels: ["skip-changelog"]

version-resolver:
  major:
    labels: ["major"]
  minor:
    labels: ["minor", "enhancement", "feature"]
  patch:
    labels:
      ["patch", "bug", "fix", "security", "chore", "documentation", "docs", "dependencies"]
  default: patch

template: |
  ## What's changed

  $CHANGES
