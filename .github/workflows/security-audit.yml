name: Security Audit

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  pull_request:
    paths: ["package.json", "pnpm-lock.yaml"]
  push:
    branches: [main]
    paths: ["package.json", "pnpm-lock.yaml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup application
        id: app
        uses: ./.github/actions/setup-app

      # High and critical findings fail PRs and pushes. Scheduled runs never fail
      # the job; they open or update a tracking issue instead.
      - name: Audit dependencies
        id: audit
        if: steps.app.outputs.present == 'true'
        continue-on-error: ${{ github.event_name == 'schedule' }}
        run: pnpm audit --audit-level=high

      - name: Open or update tracking issue (scheduled runs only)
        if: github.event_name == 'schedule' && steps.audit.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = "Security audit: vulnerable dependencies detected";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The scheduled dependency audit found high or critical vulnerabilities.",
              "",
              `Workflow run: ${runUrl}`,
              "",
              "Review `pnpm audit`, update or replace the affected packages, or record an accepted advisory in docs/SECURITY_POLICY.md with a mitigation and review date.",
            ].join("\n");

            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open",
              labels: "security,dependencies",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body: `Still failing as of ${new Date().toISOString()}.\n\n${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body,
                labels: ["security", "dependencies"],
              });
            }
