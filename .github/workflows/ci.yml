name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Job names are the status-check IDs referenced in sdd.yaml (devex.ci.required-checks).
# Application jobs skip cleanly until a package.json exists.
jobs:
  test-coverage-check:
    name: test-coverage-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require test changes alongside code changes
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-pr-tests.mjs

  sdd-check:
    name: sdd-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Validate sdd.yaml against its schema
        run: npx --yes ajv-cli@5.0.0 validate --spec=draft7 -s sdd.schema.json -d sdd.yaml

      - name: Check Constitution traceability and file references
        run: node scripts/check-sdd-refs.mjs

      - name: Check relative links in markdown
        run: node scripts/check-doc-links.mjs

      - name: Test the governance scripts
        run: node --test "scripts/__tests__/*.test.mjs"

  version-sync:
    name: version-sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tag, package.json, and CHANGELOG.md agree
        run: node scripts/check-version-sync.mjs

  audit-secrets:
    name: audit-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan tracked files for secrets
        run: node scripts/scan-secrets.mjs

  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup application
        id: app
        uses: ./.github/actions/setup-app

      - name: Lint
        if: steps.app.outputs.present == 'true'
        run: pnpm lint

      - name: Typecheck
        if: steps.app.outputs.present == 'true'
        run: pnpm typecheck

      - name: Unit tests with coverage thresholds
        if: steps.app.outputs.present == 'true'
        run: pnpm coverage

      - name: Build
        if: steps.app.outputs.present == 'true'
        run: pnpm build

  test-e2e:
    name: test-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup application
        id: app
        uses: ./.github/actions/setup-app

      - name: Cache Playwright browsers
        if: steps.app.outputs.present == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.app.outputs.present == 'true'
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps
          else
            pnpm exec playwright install --with-deps
          fi

      - name: Build
        if: steps.app.outputs.present == 'true'
        run: pnpm build

      - name: End-to-end tests
        if: steps.app.outputs.present == 'true'
        run: pnpm test:e2e

      - name: Visual regression tests
        if: steps.app.outputs.present == 'true'
        run: pnpm test:visual

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  test-a11y:
    name: test-a11y
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup application
        id: app
        uses: ./.github/actions/setup-app

      - name: Install Playwright browsers
        if: steps.app.outputs.present == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        if: steps.app.outputs.present == 'true'
        run: pnpm build

      - name: Accessibility audits (axe)
        if: steps.app.outputs.present == 'true'
        run: pnpm test:a11y

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
